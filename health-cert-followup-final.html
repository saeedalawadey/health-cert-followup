:root{--bg:#f4f6f8;--c:#fff;--t:#1f2937;--m:#6b7280;--p:#0f766e;--bd:#e5e7eb;--sh:0 1px 2px #0f172a0d,0 4px 14px #0f172a0a}
*{box-sizing:border-box}body{margin:0;font-family:'Thmanyah Sans','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--t);font-size:15px;line-height:1.6}
h1,h2,h3,.kb{font-family:'Thmanyah Display','Thmanyah Sans',serif;font-weight:700}h1{font-size:25px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 8px}
button,input,select,textarea{font:inherit}
#side{position:fixed;inset:0 0 0 auto;width:232px;background:#0d3d3a;color:#fff;padding:14px 10px;overflow:auto;z-index:30;transition:transform .2s}
.brand{padding:6px 8px 14px;margin-bottom:8px;border-bottom:1px solid #ffffff22;font-family:'Thmanyah Display',serif;font-size:16px}.brand small{display:block;font-family:'Thmanyah Sans';font-size:12px;opacity:.7}
.nv{display:flex;gap:10px;width:100%;background:none;border:0;color:#cfeee9;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:right;min-height:42px}.nv:hover,.nv.on{background:#0f766e;color:#fff}.nv i{font-style:normal;width:22px}
#main{margin-inline-start:232px;padding:24px 28px;max-width:1400px;min-height:100vh}
#top{display:none;position:sticky;top:0;background:#0d3d3a;color:#fff;padding:10px 14px;z-index:20;align-items:center;gap:10px}#top button{background:none;border:0;color:#fff;font-size:24px}
footer{text-align:center;color:var(--m);font-size:13px;padding:22px 0 6px}.sub{color:var(--m);margin:0 0 16px;font-size:14px}.muted{color:var(--m);font-size:13px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer;border-inline-start:4px solid var(--p)}.k:hover{background:#f0f9f7}.k b{font-size:26px;display:block;line-height:1.2}.k span{font-size:13px;color:var(--m)}
.rt{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}.rt div{background:#e6f4f1;border-radius:10px;padding:10px 14px}.rt b{font-size:24px;display:block}.rt span{font-size:12.5px;color:#115e59}
.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;min-height:40px}.btn:hover{background:#f3f4f6}.btn.p{background:var(--p);color:#fff;border-color:var(--p)}.btn.d{color:#b91c1c}.btn.s{min-height:32px;padding:3px 10px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.bar.r{justify-content:flex-end;margin-top:14px}
input,select,textarea{border:1px solid #d1d5db;border-radius:8px;padding:8px 10px;background:#fff;max-width:100%;min-height:40px}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #5eead4}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:10px}.fg label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--m)}.fg .w{grid-column:1/-1}.fg textarea{width:100%}
.ck{display:flex;flex-wrap:wrap;gap:6px}.ck label{flex-direction:row!important;align-items:center;gap:4px;background:#f3f4f6;border-radius:14px;padding:3px 10px;color:var(--t)!important}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--bd);border-radius:10px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th{background:#f9fafb;color:var(--m)}tbody tr.cl{cursor:pointer}tbody tr.cl:hover{background:#f0f9f7}
.bd{display:inline-block;padding:1px 9px;border-radius:12px;font-size:12.5px;font-weight:600;white-space:nowrap}.bd.r{background:#fee2e2;color:#991b1b}.bd.gr{background:#dcfce7;color:#166534}.bd.a{background:#fef3c7;color:#92400e}.bd.b{background:#dbeafe;color:#1e40af}.bd.o{background:#ffedd5;color:#9a3412}.bd.t{background:#ccfbf1;color:#115e59}.bd.g{background:#e5e7eb;color:#374151}.bd.k2{background:#1f2937;color:#fff}
.al{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--bd);cursor:pointer}.al:hover{background:#f9fafb}.al .n{flex:1}
.ov{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}.md{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:700px;margin:auto}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 14px}.kv span{display:block;color:var(--m);font-size:12px}
.tl{position:relative;margin:0;padding:0 18px 0 0;border-inline-end:2px solid #cbd5e1;list-style:none}.tl li{position:relative;padding:0 0 14px}.tl li::before{content:'';position:absolute;inset-inline-end:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--c0,#64748b);border:2px solid #fff}.tl .d{font-size:12.5px;color:var(--m)}.tl small{display:block;color:var(--m)}
.chip{display:inline-flex;gap:6px;align-items:center;background:#f3f4f6;border-radius:14px;padding:3px 10px;margin:3px}.chip button{border:0;background:none;cursor:pointer;color:#b91c1c}
.fn{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin-top:4px}.fn i{display:block;height:100%;background:var(--p)}
.demo{background:#fef3c7;color:#92400e;padding:8px 14px;border-radius:8px;margin-bottom:12px;font-size:14px}
#toast{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:92vw;background:#111827;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;display:none}#toast.err{background:#b91c1c}
.empty{text-align:center;padding:30px;color:var(--m)}.doc .dh{border-bottom:3px solid var(--p);padding-bottom:8px;margin-bottom:12px}
@media(max-width:820px){#side{transform:translateX(100%)}#side.open{transform:none}#main{margin:0;padding:12px}#top{display:flex}}
/* ===== تصميم التقرير المطبوع — الرومانسية (يؤثر على الطباعة فقط) ===== */
.pr-only{display:none}.pr-sp,.pr-spf{display:none}
@media print{
:root{--o:#E96F30;--pk:#E42B60;--mr:#591C1B;--tint:#FFF5EF;--ln:#dccbc3}
@page{margin:10mm 10mm 18mm 10mm;
 @bottom-center{content:"الصفحة " counter(page) " من " counter(pages);font-family:'Thmanyah Sans','Segoe UI',Tahoma,sans-serif;font-size:10px;font-weight:700;color:#591C1B;direction:rtl;vertical-align:middle}}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{background:#fff!important}
body{font-size:12px;color:#1b1b1b}
#side,#top,.np,footer,#toast,#mo,#dlg,.ov,.demo{display:none!important}
#main{margin:0!important;padding:0!important;max-width:none!important;min-height:0!important}
.card{box-shadow:none!important;border:0!important;padding:0!important;margin:0!important;border-radius:0!important;background:none!important}
.doc>.dh,.doc>.muted{display:none!important}
.doc{padding:6mm 6.5mm 0!important}
.pr-only{display:block}
.pr-frame{display:block;position:fixed;top:0;bottom:0;left:0;right:0;border:1.4pt solid var(--o);pointer-events:none}
.pr-frame::after{content:"";position:absolute;inset:1.2mm;border:.5pt solid var(--mr)}
.pr-foot{display:flex;position:fixed;left:2.2mm;right:2.2mm;bottom:2.2mm;height:8mm;align-items:center;justify-content:space-between;gap:8mm;font-size:9.5px;color:var(--mr);border-top:.5pt solid var(--ln);padding:0 4mm}
.pr-foot b{font-weight:700}
.pr-head{display:flex;align-items:center;justify-content:space-between;gap:10mm;padding:0 0 3mm}
.pr-head img{height:15mm;width:auto;display:block}
.pr-head .org{text-align:left;line-height:1.35}
.pr-head .org b{display:block;font-family:'Thmanyah Display','Thmanyah Sans',serif;font-size:17px;color:var(--mr)}
.pr-head .org span{font-size:10.5px;color:#444}
.pr-rule{height:2.2pt;background:linear-gradient(to left,var(--o),var(--pk));border-radius:2px;margin:0 0 4mm}
.pr-title{text-align:center;margin:0 0 4mm;break-after:avoid}
.pr-title h1{margin:0;font-size:22px;color:var(--mr);line-height:1.35}
.pr-title p{margin:1mm 0 0;font-size:11.5px;color:#555}
.pr-title i{display:block;width:34mm;height:2pt;background:var(--pk);margin:2mm auto 0;border-radius:2px}
.pr-meta{display:grid;grid-template-columns:repeat(var(--mc,3),1fr);border:.6pt solid var(--ln);border-radius:2mm;overflow:hidden;margin:0 0 1mm;break-inside:avoid;background:var(--tint)}
.pr-meta div{padding:1.6mm 3mm;border-inline-start:.5pt solid var(--ln);border-bottom:.5pt solid var(--ln);min-width:0}
.pr-meta span{display:block;font-size:9.5px;color:#7a5a50}
.pr-meta b{display:block;font-size:11.5px;color:#1b1b1b;overflow-wrap:anywhere}
.rt{gap:3mm!important;margin:0 0 4mm!important;break-inside:avoid;grid-template-columns:repeat(auto-fit,minmax(38mm,1fr))!important}
.rt div{background:var(--tint)!important;border:.6pt solid var(--ln);border-inline-start:2.2pt solid var(--o);border-radius:1.5mm;padding:1.5mm 3mm!important}
.rt b{font-size:17px!important;color:var(--mr)}.rt span{color:#444!important;font-size:10.5px!important}
.tw{border:0!important;overflow:visible!important;background:none!important;border-radius:0!important}
table{width:100%;border-collapse:collapse;font-size:11px;line-height:1.55;table-layout:auto}
thead{display:table-header-group}
tr{break-inside:avoid;page-break-inside:avoid}
th,td{white-space:normal!important;overflow-wrap:break-word;word-break:normal;padding:1.6mm 2mm;text-align:right;vertical-align:middle;border:.5pt solid var(--ln)}
th{background:var(--mr)!important;color:#fff!important;font-weight:700;font-size:11px;border-color:var(--mr)}
tbody tr:nth-child(even) td{background:var(--tint)}
td.nw{white-space:nowrap!important;overflow-wrap:normal}
.pr-sp{display:table-row}.pr-sp th,.pr-spf td{background:transparent!important;border:0!important;padding:0!important;height:5mm}

<script>

(function (root) {
  const CLONE = o => JSON.parse(JSON.stringify(o));
  const OLD = ['branches','emps','tests','trains','contacts','verifs','cycles','regions','sims','batches','bfu'];
  const NEW = ['cities','employeeBranchHistory','cases','caseStatusHistory','officialExams','importRows','audit'];
  const counts = d => { const c = {}; if (!d || typeof d !== 'object') return c; OLD.concat(NEW).forEach(k => { if (Array.isArray(d[k])) c[k] = d[k].length; }); return c; };

    A('emps').forEach(e => { if (!B.has(e.branchId)) W.push(['emp_bad_branch', e.id, e.name]); });
    ['trains','contacts','tests','verifs'].forEach(k => A(k).forEach(x => { if (!E.has(x.empId)) W.push([k + '_orphan', x.id]); }));
    A('cycles').forEach(c => { if (!E.has(c.empId)) W.push(['cycle_orphan', c.id]); });
    A('batches').forEach(b => {
      if (!R.has(b.regionId)) W.push(['batch_bad_region', b.id, b.code]);
      if (!B.has(b.branchId)) W.push(['batch_bad_branch', b.id, b.code]);
      if (!(b.empIds || []).length) W.push(['batch_empty', b.id, b.code]);

    const t = (d.tests || []).filter(x => x.empId === e.id && x.cycleId === cy.id);
    const ver = (d.verifs || []).filter(x => x.empId === e.id);
    if (e.closed) return 'مكتمل';
    if (t.length) { const l = t[t.length - 1]; if (l.result === 'مجتاز') return ver.length ? 'تم التحقق' : 'بانتظار التحقق'; return 'راسب رسميًا'; }
    if (e.examDate) return 'بانتظار الاختبار الرسمي';

    NEW.forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
    OLD.forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });

    d.emps.forEach(e => {
      if (e.employeeNo === undefined) e.employeeNo = e.empNo || '';
      if (e.nationality === undefined) e.nationality = '';          // لا تخمين
      if (e.active === undefined) e.active = true;
      if (!e.createdAt) e.createdAt = e.recruitedAt || '';
      e.updatedAt = e.updatedAt || e.createdAt;
    });

        receivedDate: e.recruitedAt || '', openedDate: cy.startedAt || e.recruitedAt || '', status: st, priority: 'عادي',
        expectedExamDate: e.examDate || '', closedDate: e.closed ? (e.closedAt || '') : '', closeReason: '', notes: (e.hist && e.hist.note) || '',
        createdAt: cy.startedAt || '', updatedAt: now });

    });

    d.tests.forEach(t => { const cs = d.cases.find(c => c.cycleId === t.cycleId); d.officialExams.push({
      id: 'oe_' + t.id, testId: t.id, caseId: cs ? cs.id : '', employeeId: t.empId, examDate: t.date, examType: '', result: t.result === 'مجتاز' ? 'ناجح' : t.result === 'غير مجتاز' ? 'راسب' : 'غير معروف',
      score: '', certificateNumber: '', source: t.source || '', notes: t.notes || '' }); });

/* ============================================================
   التقرير الشامل المتكامل — Comprehensive Integrated Report
   يُضاف كخيار مستقل دون المساس بالتقارير الحالية
   ============================================================ */
(function(){
/* ---- أقسام التقرير الشامل ---- */
const COMP_SECS = [
  ['cover','الغلاف والبيانات العامة'],
  ['exec','الملخص التنفيذي'],
  ['rec','الموظفون المستلمون تحت المتابعة'],
  ['int','التدريب الداخلي والمحاكاة'],
  ['off','الاختبارات الرسمية — ملخص لكل موظف'],
  ['offd','سجل جميع محاولات الاختبارات'],
  ['fol','تقرير المتابعة'],
  ['br','التحليل حسب المنطقة والفرع'],
  ['brl','قوائم الفروع بالرقم الوظيفي'],
  ['dif','الصعوبات الأكثر تكراراً'],
  ['app','الملحق التفصيلي']
];
const COMP_SEC_KEYS = COMP_SECS.map(x=>x[0]);
const defSecs = ()=>{const o={};COMP_SEC_KEYS.forEach(k=>o[k]=true);return o};

/* تهيئة حقول التقرير الشامل على كائن R دون كسر الحقول الحالية */
if(typeof R!=='undefined'){
  if(!R.region) R.region='';
  if(!R.secs) R.secs=defSecs();
  if(!R._compBuilt) R._compBuilt=false;
}

/* إضافة خيار التقرير الشامل في أعلى القائمة */
const _rtyPrev = Object.assign({}, RTY);
Object.keys(RTY).forEach(k=>delete RTY[k]);
RTY.comp = '📊 التقرير الشامل — تقرير الإدارة الكامل';
Object.assign(RTY, _rtyPrev);

/* ---- بناء نموذج بيانات موحّد للتقرير الشامل ---- */
function buildCompData(){
  const secs = R.secs || defSecs();
  const regionFilter = R.region||'';
  const branchFilter = R.branch||'';
  const statusFilter = R.status||'';
  const rng = !R.from && !R.to;
  const I = d => rng || inR(d);

  /* قائمة الفروع ضمن الفلتر */
  let branches = brs();
  if(regionFilter) branches = branches.filter(b=>b.regionId===regionFilter);
  if(branchFilter) branches = branches.filter(b=>b.id===branchFilter);
  const branchIds = new Set(branches.map(b=>b.id));
  const regionIds = new Set(branches.map(b=>b.regionId).filter(Boolean));

  /* الموظفون ضمن الفلتر */
  let L = E().filter(e=>{
    if(branchFilter && e.branchId!==branchFilter) return false;
    if(regionFilter){
      const b = bById(e.branchId);
      if(!b || b.regionId!==regionFilter) return false;
    }
    if(statusFilter && fs(e)!==statusFilter) return false;
    return true;
  });
  /* عند فلتر تاريخ الاستلام في قسم المستلمين */
  const Lrecv = L.filter(e=>rng || inR(e.recruitedAt));
  const ids = new Set(L.map(e=>e.id));

  /* السجلات المرتبطة */
  const trs = (db.trains||[]).filter(t=>ids.has(t.empId) && I(t.date));
  const sms = (db.sims||[]).filter(s=>ids.has(s.empId) && I(s.date));
  const tts = (db.tests||[]).filter(t=>ids.has(t.empId) && I(t.date)).sort(byD);
  const cts = (db.contacts||[]).filter(t=>ids.has(t.empId) && I(t.date));
  const vrs = (db.verifs||[]).filter(t=>ids.has(t.empId) && I(t.date));

  const cn = (a,f)=>a.filter(f).length;
  const openEmps = L.filter(e=>!e.closed);
  const passTests = cn(tts, t=>t.result==='ناجح');
  const failTests = cn(tts, t=>t.result==='راسب');
  const pendTests = cn(tts, t=>t.result==='بانتظار النتيجة');
  const trainedIds = new Set(trs.map(t=>t.empId));
  const simIds = new Set(sms.map(s=>s.empId));

  /* --- الملخص التنفيذي --- */
  const summary = {
    totalEmps: L.length,
    openEmps: openEmps.length,
    closedEmps: L.filter(e=>e.closed).length,
    totalAttempts: tts.length,
    passCount: passTests,
    failCount: failTests,
    pendCount: pendTests,
    trainedCount: trainedIds.size,
    simCount: simIds.size,
    trainSessions: trs.length,
    simSessions: sms.length,
    branchesAffected: branches.filter(b=>L.some(e=>e.branchId===b.id)).length,
    regionsAffected: regionIds.size,
    contactsCount: cts.length,
    passPct: tts.length ? pct(passTests, tts.length) : '—',
    failPct: tts.length ? pct(failTests, tts.length) : '—',
    trainPct: L.length ? pct(trainedIds.size, L.length) : '—',
    simPct: L.length ? pct(simIds.size, L.length) : '—'
  };

  /* --- الغلاف --- */
  const cover = {
    org: (db.settings&&db.settings.org) || 'شركة الرومانسية . معهد الرومانسية للتدريب',
    title: 'التقرير الشامل لمتابعة الشهادة الصحية',
    sys: 'نظام متابعة الراسبين في اختبار الشهادة الصحية',
    period: (R.from||R.to) ? `${R.from||'—'} → ${R.to||'—'}` : 'جميع الفترات',
    issued: today(),
    regions: regionIds.size || (regionFilter?1:(db.regions||[]).length),
    branches: branches.length,
    totalEmps: L.length,
    openEmps: openEmps.length,
    totalTests: tts.length,
    totalAttempts: tts.length
  };

  /* --- الموظفون المستلمون --- */
  const recRows = Lrecv.map(e=>{
    const c = last(ctOf(e))||{};
    const T = tsOf(e);
    const lt = last(T);
    return {
      empNo: e.empNo||'—',
      name: nm(e),
      iqama: e.iqama||'',
      jobTitle: e.jobTitle||'—',
      region: (rg((bById(e.branchId)||{}).regionId)||{}).name||'—',
      branch: bn(e),
      recruitedAt: e.recruitedAt||'—',
      status: fs(e),
      lastAction: c.date ? (c.nextAction||c.outcome||c.method||'—') : '—',
      lastTestDate: lt ? lt.date : ((e.hist&&e.hist.lastDate)||'—'),
      lastResult: dl(res(e))
    };
  });

  /* --- التدريب والمحاكاة --- */
  const intRows = L.filter(e=>trainedIds.has(e.id)||simIds.has(e.id)).map(e=>{
    const myTr = trs.filter(t=>t.empId===e.id);
    const mySm = sms.filter(s=>s.empId===e.id);
    const lt = last(myTr);
    const ls = last(mySm);
    return {
      empNo: e.empNo||'—',
      name: nm(e),
      branch: bn(e),
      trainCount: myTr.length,
      lastTrainDate: lt?lt.date:'—',
      lastTrainType: lt?lt.type:'—',
      lastTrainAttend: lt?(lt.attendance||'—'):'—',
      simCount: mySm.length,
      lastSimDate: ls?ls.date:'—',
      lastSimPct: ls?(ls.pct+'%'):'—',
      lastSimResult: ls?(+ls.pct>=PASS?'اجتاز داخلياً':'لم يجتز'):'—',
      difficulties: [...new Set([...myTr,...mySm].flatMap(x=>x.difficulty||[]))].join('، ')||'—'
    };
  });
  const intSummary = {
    trained: trainedIds.size,
    trainSessions: trs.length,
    simSessions: sms.length,
    simPassed: cn(sms,s=>+s.pct>=PASS),
    simFailed: cn(sms,s=>+s.pct<PASS),
    needRetrain: intRows.filter(r=>r.simCount && r.lastSimResult==='لم يجتز').length
  };

  /* --- ملخص الاختبارات الرسمية لكل موظف --- */
  const offRows = L.filter(e=>{
    const T=tsOf(e);
    return T.some(t=>I(t.date)) || (rng && e.hist && e.hist.lastResult);
  }).map(e=>{
    const T = tsOf(e).filter(t=>I(t.date));
    const allT = tsOf(e);
    const first = allT[0];
    const lt = last(allT);
    return {
      empNo: e.empNo||'—',
      name: nm(e),
      branch: bn(e),
      region: (rg((bById(e.branchId)||{}).regionId)||{}).name||'—',
      attempts: allT.length || (e.hist&&e.hist.lastResult?1:0),
      firstDate: first?first.date:'—',
      lastDate: lt?lt.date:((e.hist&&e.hist.lastDate)||'—'),
      lastResult: dl(res(e)),
      fails: fails(e),
      status: fs(e)
    };
  });

  /* --- سجل المحاولات --- */
  const offdRows = tts.map(t=>{
    const e = emp(t.empId)||{};
    return {
      date: t.date||'—',
      empNo: e.empNo||'—',
      name: nm(e),
      region: (rg((bById(e.branchId)||{}).regionId)||{}).name||'—',
      branch: bn(e),
      attempt: t.attemptNumber||'غير معروف',
      result: dl(t.result),
      source: t.source||'—',
      notes: t.notes||'—'
    };
  });

  /* --- المتابعة --- */
  const folRows = openEmps.map(e=>{
    const c = last(ctOf(e))||{};
    const T = tsOf(e);
    const lt = last(T);
    return {
      empNo: e.empNo||'—',
      name: nm(e),
      branch: bn(e),
      lastAction: c.date||'—',
      lastActionDetail: c.nextAction||c.outcome||'—',
      lastTestDate: lt?lt.date:'—',
      lastResult: dl(res(e)),
      status: fs(e),
      nextDate: c.nextDate||'—',
      updated: c.date||e.recruitedAt||'—'
    };
  });

  /* --- حسب المنطقة والفرع --- */
  const regions = (db.regions||[]).filter(r=>!regionFilter||r.id===regionFilter);
  const brAnalysis = [];
  regions.forEach(r=>{
    const rBranches = branches.filter(b=>b.regionId===r.id);
    if(!rBranches.length && regionFilter) return;
    const rEmps = L.filter(e=>{
      const b=bById(e.branchId); return b&&b.regionId===r.id;
    });
    const branchRows = rBranches.map(b=>{
      const bl = L.filter(e=>e.branchId===b.id);
      const bIds = new Set(bl.map(e=>e.id));
      const bTests = tts.filter(t=>bIds.has(t.empId));
      return {
        branch: b.name,
        emps: bl.length,
        open: bl.filter(e=>!e.closed).length,
        tests: bTests.length,
        attempts: bTests.length,
        pass: cn(bTests,t=>t.result==='ناجح'),
        fail: cn(bTests,t=>t.result==='راسب')
      };
    }).filter(x=>x.emps>0);
    if(rEmps.length || branchRows.length){
      brAnalysis.push({
        region: r.name,
        emps: rEmps.length,
        open: rEmps.filter(e=>!e.closed).length,
        branches: branchRows
      });
    }
  });
  /* فروع بلا منطقة */
  const noRegBranches = branches.filter(b=>!b.regionId);
  if(noRegBranches.length){
    const branchRows = noRegBranches.map(b=>{
      const bl = L.filter(e=>e.branchId===b.id);
      const bIds = new Set(bl.map(e=>e.id));
      const bTests = tts.filter(t=>bIds.has(t.empId));
      return {
        branch: b.name,
        emps: bl.length,
        open: bl.filter(e=>!e.closed).length,
        tests: bTests.length,
        attempts: bTests.length,
        pass: cn(bTests,t=>t.result==='ناجح'),
        fail: cn(bTests,t=>t.result==='راسب')
      };
    }).filter(x=>x.emps>0);
    if(branchRows.length){
      brAnalysis.push({region:'— بدون منطقة —', emps:branchRows.reduce((a,x)=>a+x.emps,0), open:branchRows.reduce((a,x)=>a+x.open,0), branches:branchRows});
    }
  }

  /* --- قوائم الفروع بالرقم الوظيفي --- */
  const brlGroups = [];
  [...branches].sort((a,b)=>((rg(a.regionId)||{}).name||'').localeCompare((rg(b.regionId)||{}).name||'','ar')||a.name.localeCompare(b.name,'ar')).forEach(b=>{
    const bl = L.filter(e=>e.branchId===b.id).sort((a,b)=>String(a.empNo).localeCompare(String(b.empNo),undefined,{numeric:true}));
    if(!bl.length) return;
    brlGroups.push({
      region: (rg(b.regionId)||{}).name||'—',
      branch: b.name,
      rows: bl.map(e=>{
        const c=last(ctOf(e))||{};
        const s=last(smOf(e));
        const T=tsOf(e); const lt=last(T);
        return {
          empNo: e.empNo||'—',
          name: nm(e),
          jobTitle: e.jobTitle||'—',
          status: fs(e),
          lastTest: lt?lt.date:'—',
          lastResult: dl(res(e)),
          lastAction: c.date||'—',
          lastSim: s?(s.pct+'%'):'—'
        };
      })
    });
  });

  /* --- الصعوبات --- */
  const difMap = {};
  const difBranchMap = {};
  L.forEach(e=>{
    const diffs = [...new Set([...trOf(e),...smOf(e)].flatMap(x=>x.difficulty||[]))];
    diffs.forEach(d=>{
      difMap[d]=(difMap[d]||0)+1;
      if(!difBranchMap[d]) difBranchMap[d]=new Set();
      difBranchMap[d].add(bn(e));
    });
  });
  const difRows = Object.entries(difMap).sort((a,b)=>b[1]-a[1]).map(([d,k])=>({
    difficulty: d,
    count: k,
    pct: pct(k, L.length),
    branches: [...(difBranchMap[d]||[])].join('، ')||'—'
  }));
  /* أكثر الموظفين محاولات */
  const attemptMap = {};
  tts.forEach(t=>{ attemptMap[t.empId]=(attemptMap[t.empId]||0)+1; });
  const topAttempts = Object.entries(attemptMap).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id,n])=>{
    const e=emp(id)||{};
    return {empNo:e.empNo||'—', name:nm(e), branch:bn(e), attempts:n};
  });

  /* --- الملحق التفصيلي --- */
  const appEmps = L.map(e=>({
    empNo:e.empNo||'—', name:nm(e), branch:bn(e), region:(rg((bById(e.branchId)||{}).regionId)||{}).name||'—',
    iqama:e.iqama||'', jobTitle:e.jobTitle||'', phone:e.phone||'', recruitedAt:e.recruitedAt||'',
    status:fs(e), lastResult:dl(res(e)), fails:fails(e), closed:e.closed?'نعم':'لا', notes:e.notes||''
  }));
  const appTrains = trs.map(t=>{
    const e=emp(t.empId)||{};
    return {empNo:e.empNo||'—', name:nm(e), branch:bn(e), date:t.date, type:t.type||'', trainer:t.trainer||'', topics:t.topics||'', attendance:t.attendance||'', difficulty:(t.difficulty||[]).join('، '), notes:t.trainerNotes||t.notes||''};
  });
  const appSims = sms.map(t=>{
    const e=emp(t.empId)||{};
    return {empNo:e.empNo||'—', name:nm(e), branch:bn(e), date:t.date, n:t.n, score:t.score, max:t.max, pct:t.pct, result:t.result||'', difficulty:(t.difficulty||[]).join('، '), notes:t.notes||''};
  });
  const appTests = tts.map(t=>{
    const e=emp(t.empId)||{};
    return {empNo:e.empNo||'—', name:nm(e), branch:bn(e), date:t.date, attempt:t.attemptNumber||'غير معروف', result:dl(t.result), source:t.source||'', notes:t.notes||''};
  });
  const appContacts = cts.map(t=>{
    const e=emp(t.empId)||{};
    return {empNo:e.empNo||'—', name:nm(e), branch:bn(e), date:t.date, method:t.method||'', party:t.party||'', outcome:t.outcome||'', notes:t.notes||'', nextAction:t.nextAction||'', nextDate:t.nextDate||''};
  });

  return {
    filters: {from:R.from, to:R.to, region:regionFilter, branch:branchFilter, status:statusFilter, ids:!!R.ids},
    secs, cover, summary, recRows, intRows, intSummary, offRows, offdRows, folRows,
    brAnalysis, brlGroups, difRows, topAttempts,
    appEmps, appTrains, appSims, appTests, appContacts,
    empty: L.length===0
  };
}

/* ---- عرض HTML للتقرير الشامل ---- */
function tableHTML(head, rows){
  if(!rows || !rows.length) return '<div class="empty">لا توجد بيانات في هذا القسم ضمن الفلاتر المحددة</div>';
  const escC = c => esc(c==null?'':String(c));
  return T_(head, rows.map(r=>r.map(escC)));
}
function secTitle(t){return `<h2 class="comp-sec-title">${esc(t)}</h2>`;}
function kpiBox(items){
  return `<div class="rt">${items.map(([l,v])=>`<div><b>${esc(String(v))}</b>${esc(l)}</div>`).join('')}</div>`;
}

function renderCompHTML(D){
  if(!D) return '<div class="empty">اضغط «إنشاء التقرير» لبناء التقرير الشامل</div>';
  if(D.empty) return '<div class="card doc"><div class="empty">لا توجد بيانات مطابقة للفلاتر المحددة</div></div>';
  const secs = D.secs || defSecs();
  const showIds = D.filters.ids;
  let h = '<div class="card doc comp-report">';

  /* 1. الغلاف */
  if(secs.cover!==false){
    const c=D.cover;
    h += `<div class="comp-cover pr-break">
      <div class="comp-cover-inner">
        <h1>${esc(c.title)}</h1>
        <p class="muted">${esc(c.sys)}</p>
        <div class="pr-meta" style="--mc:4;margin-top:16px">
          <div><span>الفترة الزمنية</span><b>${esc(c.period)}</b></div>
          <div><span>تاريخ الإصدار</span><b class="pr-date">${esc(c.issued)}</b></div>
          <div><span>عدد المناطق</span><b>${c.regions}</b></div>
          <div><span>عدد الفروع</span><b>${c.branches}</b></div>
          <div><span>إجمالي الموظفين</span><b>${c.totalEmps}</b></div>
          <div><span>تحت المتابعة</span><b>${c.openEmps}</b></div>
          <div><span>إجمالي الاختبارات</span><b>${c.totalTests}</b></div>
          <div><span>إجمالي المحاولات</span><b>${c.totalAttempts}</b></div>
        </div>
      </div>
    </div>`;
  }

  /* 2. الملخص التنفيذي */
  if(secs.exec!==false){
    const s=D.summary;
    h += `<div class="comp-section pr-break">${secTitle('الملخص التنفيذي')}${kpiBox([
      ['إجمالي الموظفين',s.totalEmps],
      ['تحت المتابعة',s.openEmps],
      ['مغلقون',s.closedEmps],
      ['إجمالي المحاولات',s.totalAttempts],
      ['حالات الاجتياز',s.passCount],
      ['حالات عدم الاجتياز',s.failCount],
      ['بانتظار النتيجة',s.pendCount],
      ['نسبة الاجتياز',s.passPct],
      ['موظفون أكملوا التدريب',s.trainedCount],
      ['موظفون خضعوا للمحاكاة',s.simCount],
      ['جلسات التدريب',s.trainSessions],
      ['جلسات المحاكاة',s.simSessions],
      ['الفروع المتأثرة',s.branchesAffected],
      ['المناطق المتأثرة',s.regionsAffected]
    ])}</div>`;
  }

  /* 3. الموظفون المستلمون */
  if(secs.rec!==false){
    const head = ['الرقم الوظيفي','اسم الموظف',...(showIds?['الهوية/الإقامة']:[]),'المسمى الوظيفي','المنطقة','الفرع','تاريخ الاستلام','حالة المتابعة','آخر إجراء','آخر اختبار','آخر نتيجة'];
    const rows = D.recRows.map(r=>[r.empNo,r.name,...(showIds?[r.iqama]:[]),r.jobTitle,r.region,r.branch,r.recruitedAt,r.status,r.lastAction,r.lastTestDate,r.lastResult]);
    h += `<div class="comp-section pr-break">${secTitle('الموظفون المستلمون تحت المتابعة')}${tableHTML(head,rows)}</div>`;
  }

  /* 4. التدريب والمحاكاة */
  if(secs.int!==false){
    const is=D.intSummary;
    h += `<div class="comp-section pr-break">${secTitle('التدريب الداخلي والمحاكاة')}${kpiBox([
      ['موظفون مدرَّبون',is.trained],
      ['جلسات التدريب',is.trainSessions],
      ['جلسات المحاكاة',is.simSessions],
      ['محاكاة مكتملة (≥'+PASS+'%)',is.simPassed],
      ['محاكاة غير مكتملة',is.simFailed],
      ['يحتاجون إعادة تدريب',is.needRetrain]
    ])}`;
    const head=['الرقم الوظيفي','الاسم','الفرع','مرات التدريب','آخر تدريب','نوعه','الحضور','مرات المحاكاة','آخر محاكاة','النسبة','النتيجة','الصعوبات'];
    const rows=D.intRows.map(r=>[r.empNo,r.name,r.branch,r.trainCount,r.lastTrainDate,r.lastTrainType,r.lastTrainAttend,r.simCount,r.lastSimDate,r.lastSimPct,r.lastSimResult,r.difficulties]);
    h += tableHTML(head,rows)+'</div>';
  }

  /* 5. ملخص الاختبارات */
  if(secs.off!==false){
    const head=['الرقم الوظيفي','الاسم','الفرع','المنطقة','عدد المحاولات','أول اختبار','آخر اختبار','آخر نتيجة','مرات الرسوب','حالة المتابعة'];
    const rows=D.offRows.map(r=>[r.empNo,r.name,r.branch,r.region,r.attempts,r.firstDate,r.lastDate,r.lastResult,r.fails,r.status]);
    h += `<div class="comp-section pr-break">${secTitle('الاختبارات الرسمية — ملخص لكل موظف')}${tableHTML(head,rows)}</div>`;
  }

  /* 6. سجل المحاولات */
  if(secs.offd!==false){
    const head=['التاريخ','الرقم الوظيفي','اسم الموظف','المنطقة','الفرع','المحاولة','النتيجة','المصدر','ملاحظات'];
    const rows=D.offdRows.map(r=>[r.date,r.empNo,r.name,r.region,r.branch,r.attempt,r.result,r.source,r.notes]);
    h += `<div class="comp-section pr-break">${secTitle('سجل جميع محاولات الاختبارات')}${tableHTML(head,rows)}</div>`;
  }

  /* 7. المتابعة */
  if(secs.fol!==false){
    const head=['الرقم الوظيفي','الاسم','الفرع','آخر إجراء','تفصيل الإجراء','آخر اختبار','آخر نتيجة','الحالة الحالية','الإجراء القادم','تاريخ آخر تحديث'];
    const rows=D.folRows.map(r=>[r.empNo,r.name,r.branch,r.lastAction,r.lastActionDetail,r.lastTestDate,r.lastResult,r.status,r.nextDate,r.updated]);
    h += `<div class="comp-section pr-break">${secTitle('تقرير المتابعة')}${tableHTML(head,rows)}</div>`;
  }

  /* 8. التحليل حسب المنطقة والفرع */
  if(secs.br!==false){
    h += `<div class="comp-section pr-break">${secTitle('التحليل حسب المنطقة والفرع')}`;
    if(!D.brAnalysis.length) h += '<div class="empty">لا توجد بيانات مناطق/فروع</div>';
    else {
      D.brAnalysis.forEach(ra=>{
        h += `<h3>${esc(ra.region)} <span class="muted">· موظفون: ${ra.emps} · تحت المتابعة: ${ra.open}</span></h3>`;
        const head=['الفرع','عدد الموظفين','تحت المتابعة','الاختبارات','المحاولات','اجتياز','عدم اجتياز'];
        const rows=ra.branches.map(b=>[b.branch,b.emps,b.open,b.tests||'غير متوفر',b.attempts||'غير متوفر',b.pass,b.fail]);
        h += tableHTML(head,rows);
      });
    }
    h += '</div>';
  }

  /* 9. قوائم الفروع */
  if(secs.brl!==false){
    h += `<div class="comp-section pr-break">${secTitle('قوائم الفروع بالرقم الوظيفي')}`;
    if(!D.brlGroups.length) h += '<div class="empty">لا توجد قوائم فروع</div>';
    else {
      D.brlGroups.forEach(g=>{
        h += `<h3>${esc(g.region)} — ${esc(g.branch)}</h3>`;
        const head=['الرقم الوظيفي','اسم الموظف','المسمى الوظيفي','الحالة الحالية','آخر اختبار','آخر نتيجة','آخر إجراء','آخر محاكاة'];
        const rows=g.rows.map(r=>[r.empNo,r.name,r.jobTitle,r.status,r.lastTest,r.lastResult,r.lastAction,r.lastSim]);
        h += tableHTML(head,rows);
      });
    }
    h += '</div>';
  }

  /* 10. الصعوبات */
  if(secs.dif!==false){
    h += `<div class="comp-section pr-break">${secTitle('الصعوبات الأكثر تكراراً')}`;
    if(!D.difRows.length) h += '<div class="empty">لا توجد بيانات صعوبات مسجّلة</div>';
    else {
      const head=['الصعوبة','عدد الحالات','النسبة من الموظفين','الفروع المتأثرة'];
      const rows=D.difRows.map(r=>[r.difficulty,r.count,r.pct,r.branches]);
      h += tableHTML(head,rows);
      if(D.topAttempts.length){
        h += '<h3>أكثر الموظفين تكراراً للمحاولات</h3>';
        h += tableHTML(['الرقم الوظيفي','الاسم','الفرع','عدد المحاولات'], D.topAttempts.map(r=>[r.empNo,r.name,r.branch,r.attempts]));
      }
    }
    h += '</div>';
  }

  /* 11. الملحق التفصيلي */
  if(secs.app!==false){
    h += `<div class="comp-section pr-break">${secTitle('الملحق التفصيلي')}`;
    h += '<h3>جميع الموظفين</h3>';
    h += tableHTML(['الرقم الوظيفي','الاسم','الفرع','المنطقة','المسمى الوظيفي','تاريخ الاستلام','الحالة','آخر نتيجة','مرات الرسوب','مغلق'],
      D.appEmps.map(r=>[r.empNo,r.name,r.branch,r.region,r.jobTitle,r.recruitedAt,r.status,r.lastResult,r.fails,r.closed]));
    h += '<h3>جميع التدريبات</h3>';
    h += tableHTML(['الرقم الوظيفي','الاسم','الفرع','التاريخ','النوع','المدرب','الحضور','الصعوبات'],
      D.appTrains.map(r=>[r.empNo,r.name,r.branch,r.date,r.type,r.trainer,r.attendance,r.difficulty]));
    h += '<h3>جميع المحاكاة</h3>';
    h += tableHTML(['الرقم الوظيفي','الاسم','الفرع','التاريخ','الرقم','النسبة','النتيجة','الصعوبات'],
      D.appSims.map(r=>[r.empNo,r.name,r.branch,r.date,r.n,r.pct!=null?r.pct+'%':'',r.result,r.difficulty]));
    h += '<h3>جميع محاولات الاختبارات</h3>';
    h += tableHTML(['الرقم الوظيفي','الاسم','الفرع','التاريخ','المحاولة','النتيجة','المصدر'],
      D.appTests.map(r=>[r.empNo,r.name,r.branch,r.date,r.attempt,r.result,r.source]));
    h += '<h3>جميع إجراءات المتابعة (التواصل)</h3>';
    h += tableHTML(['الرقم الوظيفي','الاسم','الفرع','التاريخ','الطريقة','النتيجة','الإجراء القادم','تاريخه'],
      D.appContacts.map(r=>[r.empNo,r.name,r.branch,r.date,r.method,r.outcome,r.nextAction,r.nextDate]));
    h += '</div>';
  }

  h += '</div>';
  return h;
}

/* ---- حالة التقرير الشامل المخزّنة ---- */
let _compData = null;

window.buildCompReport = function(){
  try{
    _compData = buildCompData();
    R._compBuilt = true;
    drawRep();
    toast('تم إنشاء التقرير الشامل');
  }catch(err){
    console.error(err);
    toast('خطأ في بناء التقرير: '+(err.message||err),'err');
  }
};

window.toggleCompSec = function(k){
  if(!R.secs) R.secs=defSecs();
  R.secs[k]=!R.secs[k];
  render();
};
window.setAllCompSecs = function(v){
  if(!R.secs) R.secs=defSecs();
  COMP_SEC_KEYS.forEach(k=>R.secs[k]=!!v);
  render();
};
window.setCompRegion = function(v){
  R.region=v||'';
  /* عند تغيير المنطقة صفّر الفرع إن لم يعد تابعاً */
  if(R.branch){
    const b=bById(R.branch);
    if(b && R.region && b.regionId!==R.region) R.branch='';
  }
  render();
};

/* ---- تصدير Excel متعدد الأوراق ---- */
window.exportCompRep = function(){
  if(!window.XLSX) return toast('مكتبة Excel غير محمّلة (تحتاج اتصالًا)','err');
  if(!_compData) { buildCompReport(); }
  const D=_compData;
  if(!D || D.empty) return toast('لا توجد بيانات للتصدير','err');
  const secs=D.secs||defSecs();
  const showIds=D.filters.ids;
  const wb=XLSX.utils.book_new();
  wb.Workbook={Views:[{RTL:true}]};
  const A=(n,h,r)=>{ if(!r||!r.length) r=[['لا توجد بيانات']]; XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([h,...r]), n.substring(0,31)); };

  if(secs.exec!==false){
    const s=D.summary;
    A('الملخص التنفيذي',['المؤشر','القيمة'],[
      ['إجمالي الموظفين',s.totalEmps],['تحت المتابعة',s.openEmps],['مغلقون',s.closedEmps],
      ['إجمالي المحاولات',s.totalAttempts],['اجتياز',s.passCount],['عدم اجتياز',s.failCount],
      ['بانتظار النتيجة',s.pendCount],['نسبة الاجتياز',s.passPct],
      ['موظفون مدرَّبون',s.trainedCount],['موظفون خضعوا للمحاكاة',s.simCount],
      ['جلسات التدريب',s.trainSessions],['جلسات المحاكاة',s.simSessions],
      ['الفروع المتأثرة',s.branchesAffected],['المناطق المتأثرة',s.regionsAffected]
    ]);
  }
  if(secs.rec!==false){
    const head=['الرقم الوظيفي','اسم الموظف',...(showIds?['الهوية/الإقامة']:[]),'المسمى الوظيفي','المنطقة','الفرع','تاريخ الاستلام','الحالة','آخر إجراء','آخر اختبار','آخر نتيجة'];
    A('الموظفون تحت المتابعة', head, D.recRows.map(r=>[r.empNo,r.name,...(showIds?[r.iqama]:[]),r.jobTitle,r.region,r.branch,r.recruitedAt,r.status,r.lastAction,r.lastTestDate,r.lastResult]));
  }
  if(secs.int!==false){
    A('التدريب والمحاكاة',['الرقم الوظيفي','الاسم','الفرع','مرات التدريب','آخر تدريب','النوع','الحضور','مرات المحاكاة','آخر محاكاة','النسبة','النتيجة','الصعوبات'],
      D.intRows.map(r=>[r.empNo,r.name,r.branch,r.trainCount,r.lastTrainDate,r.lastTrainType,r.lastTrainAttend,r.simCount,r.lastSimDate,r.lastSimPct,r.lastSimResult,r.difficulties]));
  }
  if(secs.off!==false){
    A('ملخص الاختبارات',['الرقم الوظيفي','الاسم','الفرع','المنطقة','المحاولات','أول اختبار','آخر اختبار','آخر نتيجة','الرسوب','الحالة'],
      D.offRows.map(r=>[r.empNo,r.name,r.branch,r.region,r.attempts,r.firstDate,r.lastDate,r.lastResult,r.fails,r.status]));
  }
  if(secs.offd!==false){
    A('سجل المحاولات',['التاريخ','الرقم الوظيفي','الاسم','المنطقة','الفرع','المحاولة','النتيجة','المصدر','ملاحظات'],
      D.offdRows.map(r=>[r.date,r.empNo,r.name,r.region,r.branch,r.attempt,r.result,r.source,r.notes]));
  }
  if(secs.fol!==false){
    A('المتابعة',['الرقم الوظيفي','الاسم','الفرع','آخر إجراء','التفصيل','آخر اختبار','آخر نتيجة','الحالة','الإجراء القادم','آخر تحديث'],
      D.folRows.map(r=>[r.empNo,r.name,r.branch,r.lastAction,r.lastActionDetail,r.lastTestDate,r.lastResult,r.status,r.nextDate,r.updated]));
  }
  if(secs.br!==false){
    const rows=[];
    D.brAnalysis.forEach(ra=>{
      ra.branches.forEach(b=>rows.push([ra.region,b.branch,b.emps,b.open,b.tests,b.attempts,b.pass,b.fail]));
    });
    A('المناطق والفروع',['المنطقة','الفرع','الموظفون','تحت المتابعة','الاختبارات','المحاولات','اجتياز','عدم اجتياز'], rows);
  }
  if(secs.brl!==false){
    const rows=[];
    D.brlGroups.forEach(g=>g.rows.forEach(r=>rows.push([g.region,g.branch,r.empNo,r.name,r.jobTitle,r.status,r.lastTest,r.lastResult,r.lastAction])));
    A('قوائم الفروع',['المنطقة','الفرع','الرقم الوظيفي','الاسم','المسمى','الحالة','آخر اختبار','آخر نتيجة','آخر إجراء'], rows);
  }
  if(secs.dif!==false){
    A('الصعوبات',['الصعوبة','العدد','النسبة','الفروع'], D.difRows.map(r=>[r.difficulty,r.count,r.pct,r.branches]));
    if(D.topAttempts.length) A('أكثر المحاولات',['الرقم الوظيفي','الاسم','الفرع','المحاولات'], D.topAttempts.map(r=>[r.empNo,r.name,r.branch,r.attempts]));
  }
  if(secs.app!==false){
    A('ملحق_موظفون',['الرقم الوظيفي','الاسم','الفرع','المنطقة','المسمى الوظيفي','الاستلام','الحالة','آخر نتيجة','الرسوب','مغلق'],
      D.appEmps.map(r=>[r.empNo,r.name,r.branch,r.region,r.jobTitle,r.recruitedAt,r.status,r.lastResult,r.fails,r.closed]));
    A('ملحق_تدريب',['الرقم الوظيفي','الاسم','الفرع','التاريخ','النوع','المدرب','الحضور','الصعوبات'],
      D.appTrains.map(r=>[r.empNo,r.name,r.branch,r.date,r.type,r.trainer,r.attendance,r.difficulty]));
    A('ملحق_محاكاة',['الرقم الوظيفي','الاسم','الفرع','التاريخ','الرقم','النسبة','النتيجة'],
      D.appSims.map(r=>[r.empNo,r.name,r.branch,r.date,r.n,r.pct,r.result]));
    A('ملحق_اختبارات',['الرقم الوظيفي','الاسم','الفرع','التاريخ','المحاولة','النتيجة','المصدر'],
      D.appTests.map(r=>[r.empNo,r.name,r.branch,r.date,r.attempt,r.result,r.source]));
    A('ملحق_تواصل',['الرقم الوظيفي','الاسم','الفرع','التاريخ','الطريقة','النتيجة','الإجراء القادم'],
      D.appContacts.map(r=>[r.empNo,r.name,r.branch,r.date,r.method,r.outcome,r.nextAction]));
  }
  XLSX.writeFile(wb, `health-cert-comprehensive-${today()}.xlsx`);
  toast('تم تصدير التقرير الشامل إلى Excel');
};

/* ---- تعديل شاشة التقارير ---- */
const _repPageOrig = repPage;
repPage = function(){
  if(R.type!=='comp') return _repPageOrig();

  /* فروع مرتبطة بالمنطقة */
  let branchOpts = brs();
  if(R.region) branchOpts = branchOpts.filter(b=>b.regionId===R.region);
  const regionOpts = (db.regions||[]);
  const secs = R.secs || defSecs();

  return `<div class="np">
    <h1>التقارير</h1>
    <p class="sub">التقرير الشامل — تقرير إداري متكامل لدورة متابعة الموظف من الاستلام حتى الإغلاق</p>
    <div class="bar">${Object.entries(RTY).map(([k,v])=>`<button class="btn ${R.type===k?'p':''}" onclick="setR('type','${k}')">${v}</button>`).join('')}</div>

    <div class="card" style="margin-top:12px">
      <h2 style="margin-top:0">فلاتر التقرير الشامل</h2>
      <div class="fg">
        <label>من تاريخ<input type=date value="${R.from||''}" onchange="setR('from',this.value)"></label>
        <label>إلى تاريخ<input type=date value="${R.to||''}" onchange="setR('to',this.value)"></label>
        <label>المنطقة<select onchange="setCompRegion(this.value)">
          <option value="">كل المناطق</option>
          ${regionOpts.map(r=>`<option value="${r.id}" ${R.region===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}
        </select></label>
        <label>الفرع<select onchange="setR('branch',this.value)">
          <option value="">كل الفروع</option>
          ${branchOpts.map(b=>`<option value="${b.id}" ${R.branch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
        </select></label>
        <label>حالة المتابعة<select onchange="setR('status',this.value)">
          <option value="">الكل</option>
          ${STATUSES.map(s=>`<option ${R.status===s?'selected':''}>${s}</option>`).join('')}
        </select></label>
      </div>
      <div class="bar" style="margin-top:8px">
        <label><input type=checkbox ${R.ids?'checked':''} onchange="setR('ids',this.checked)"> إظهار رقم الهوية/الإقامة</label>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">أقسام التقرير</h2>
      <div class="bar" style="margin-bottom:8px">
        <button class="btn s" onclick="setAllCompSecs(true)">تحديد الكل</button>
        <button class="btn s" onclick="setAllCompSecs(false)">إلغاء تحديد الكل</button>
      </div>
      <div class="w ck" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px">
        ${COMP_SECS.map(([k,l])=>`<label><input type=checkbox ${secs[k]!==false?'checked':''} onchange="toggleCompSec('${k}')"> ${l}</label>`).join('')}
      </div>
    </div>

    <div class="bar">
      <button class="btn p" onclick="buildCompReport()">📊 إنشاء التقرير</button>
      <button class="btn" onclick="window.print()">🖨️ طباعة / PDF</button>
      <button class="btn" onclick="exportCompRep()">📤 تصدير Excel</button>
    </div>
  </div>
  <div id="res"></div>`;
};

/* ---- تعديل drawRep ---- */
const _drawRepOrig = drawRep;
drawRep = function(){
  if(R.type==='comp'){
    const el = $('#res');
    if(!el) return;
    if(!_compData || !R._compBuilt){
      el.innerHTML = '<div class="card"><div class="empty">اضغط «إنشاء التقرير» لبناء التقرير الشامل وفق الفلاتر والأقسام المحددة</div></div>';
      return;
    }
    el.innerHTML = renderCompHTML(_compData);
    /* حقن رأس الطباعة */
    try{
      const doc = el.querySelector('.doc');
      if(doc){
        const D=_compData, c=D.cover;
        doc.querySelectorAll('.pr-only').forEach(n=>n.remove());
        const cell=(l,v)=>`<div><span>${l}</span><b>${esc(v)}</b></div>`;
        doc.insertAdjacentHTML('afterbegin',
          `<div class="pr-only pr-frame"></div>
          <div class="pr-only pr-foot"><span><b>${esc(c.org)}</b></span><span>تاريخ الطباعة: <b class="pr-date">${today()}</b></span></div>
          <div class="pr-only"><div class="pr-head"><div class="org"><b>${esc(c.org)}</b><span>تقرير إداري — ${esc(c.sys)}</span></div></div><div class="pr-rule"></div>
          <div class="pr-title"><h1>${esc(c.title)}</h1><p>${esc(c.sys)}</p></div>
          <div class="pr-meta" style="--mc:4">${cell('تاريخ الإصدار',c.issued).replace('<b>','<b class="pr-date">')}${cell('الفترة',c.period)}${cell('الموظفون',c.totalEmps)}${cell('تحت المتابعة',c.openEmps)}</div></div>`);
      }
    }catch(err){console.warn('comp print header',err)}
    return;
  }
